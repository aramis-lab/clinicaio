[project]
name = "clinicaio"
version = "1.0.0"
description = "Read, write and query from BIDS neuroimaging datasets"
license = "MIT"
authors = [
    { name = "ARAMIS Lab" }
]
maintainers = [
    { name = "ARAMIS Lab", email = "aramislab.fr@gmail.com"},
]
readme = "README.md"
packages = [{include = "clinicaio", from = "src"}]
keywords = [
    "bids",
    "neuroimaging",
    "neuroscience"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# ClinicaIO adopts the same Python version policy as Clinica itself, so the dependencies are
# also impacted by it.
# See https://scientific-python.org/specs/spec-0000/
requires-python = ">=3.10,<3.15"
dependencies = [
    "pandas",
    "packaging",
    "pydantic",
    # For TypedDict mostly, notably the extra_items constructor argument available only for Python >=3.15
    "typing-extensions >= 4.16",
]

[project.urls]
sources = "https://github.com/aramis-lab/clinicaio.git"

[tool.poetry.group.dev.dependencies]
pytest = "*"
notebook = "*"
pyfakefs = "*"
mypy = "*"
# FIXME: version locked because poetry does not seem to be smart
# enough to select it on its own for Python < 3.11
pandas-stubs = "2.3.3.260113"


[tool.poetry.group.docs.dependencies]
sphinx = "*"
sphinx-autoapi = "*"
myst-nb = "*"
sphinx-book-theme = "*"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "I001",
    # "PTH",
]
ignore = ["E203", "E501", "E721"]

[tool.ruff.lint.isort]
known-first-party = ["clinicaio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mutmut]
#source_paths = [ "src/" ]
pytest_add_cli_args_test_selection= [ "tests/unittests" ]
#debug = true

[tool.mypy]
files = ["src/clinicaio"]